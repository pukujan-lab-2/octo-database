name: OIO close on merge

# Closes the observational/operational issue logs named by native closing
# verbs (`Closes/Fixes/Resolves #n`) in a merged pull request's body, adds
# `status:resolved`, rewrites the log's Lifecycle Status, and posts a
# marker-guarded comment. `Refs #n` closes nothing. Reusable workflow from
# OIO, pinned to the certified release-train commit (see stack-manifest.json
# / HANDOFF.md); bump the ref only with a deliberate train upgrade.

on:
  pull_request:
    branches: [main, production]
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Pukujan/agent-stack-train/.github/workflows/close-on-merge.yml@7cdb634b7b9bab81bfbef15c69e0a2deec720208
    with:
      oio_ref: 7cdb634b7b9bab81bfbef15c69e0a2deec720208
