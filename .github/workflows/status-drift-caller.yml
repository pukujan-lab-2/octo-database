name: OIO lifecycle drift audit

# Report-only audit: fails when an issue's status:* label contradicts GitHub's
# open/closed state (a closed log must carry status:resolved/superseded/
# obsolete/wontfix; an open log must carry status:open). Never edits issues.
# Reusable workflow from OIO, pinned to the certified release-train commit.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  drift:
    uses: Pukujan/agent-stack-train/.github/workflows/oio-status-drift.yml@368c70bc029832326c6c01fe3a5f895e840de17a
    with:
      oio_ref: 368c70bc029832326c6c01fe3a5f895e840de17a
