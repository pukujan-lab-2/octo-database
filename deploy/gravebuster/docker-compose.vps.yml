# Always-on server overlay: the embedding model runs here on the CPU, and the
# heavy services get CPU/memory ceilings so a bulk ingest slows itself down
# instead of the websites.
services:
  octo-embed:
    image: ollama/ollama:0.30.11
    container_name: octo-embed
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - octo-embed-models:/root/.ollama
    # Stopped by Sablier after 10 idle minutes; the next embedding call starts it (#448).
    labels:
      sablier.enable: "true"
      sablier.group: embed
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 4
    mem_limit: 4g
    networks:
      - octo-internal

  octo-db:
    cpus: 6
    mem_limit: 12g
    # HNSW index builds need more than Docker's 64 MB /dev/shm default.
    shm_size: 4g

  octo-api:
    cpus: 4
    mem_limit: 4g
    # Through the web container's Sablier listeners, so a call starts a stopped
    # Phoenix or embedder (#448). Overrides the values in .env.
    environment:
      - OCTO_PHOENIX_URL=http://octo-web:6006
      - OCTO_EMBEDDING_BASE_URL=http://octo-web:11434/v1

  # Phoenix: the one trace viewer (#268, #342). Agents send traces to Octo, which
  # forwards them here into the workspace's project. Its data lives in its own
  # `phoenix` database on octo-db. Traces older than the retention policy are
  # deleted by Phoenix itself.
  # The web server adds Phoenix's admin token for a request Octo has authorized
  # (Caddyfile, /phoenix). Same value Octo's API uses to reach Phoenix.
  octo-web:
    environment:
      OCTO_PHOENIX_SECRET: ${OCTO_PHOENIX_SECRET}
    # The Caddyfile's Sablier routes call http://sablier:10000, the one Sablier on the
    # host, run by the `platform` stack in Pukujan-lab/server-management
    # (komodo/resources/platform.toml). That stack creates the `sablier` network.
    networks:
      - octo-internal
      - sablier

  octo-phoenix:
    image: arizephoenix/phoenix:version-20.27.0
    container_name: octo-phoenix
    restart: unless-stopped
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@octo-db:5432/phoenix
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_ADMIN_SECRET: ${OCTO_PHOENIX_SECRET}
      # Login admin@localhost; only read when the phoenix database is first created.
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_RETENTION_DAYS:-30}
      # Served at /phoenix on the Octo hostname; Caddy strips the prefix, so no
      # extra tunnel route. Octo itself calls http://octo-phoenix:6006.
      PHOENIX_HOST_ROOT_PATH: /phoenix
      PHOENIX_ROOT_URL: ${OCTO_PHOENIX_PUBLIC_URL}
    ports:
      - "127.0.0.1:6006:6006"
    # Stopped by Sablier after 10 idle minutes; /phoenix or the API's next trace call
    # starts it (#448).
    labels:
      sablier.enable: "true"
      sablier.group: phoenix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      octo-db:
        condition: service_healthy
    mem_limit: 2g
    networks:
      - octo-internal

networks:
  sablier:
    external: true
    name: sablier

volumes:
  octo-embed-models:
    name: octo-embed-models
